[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdrk-builder"
version = "1.1.2"
description = "Internal offline Windows tool for preparing editable MDRK DOCX drafts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-docx==1.2.0",
  "lxml>=5.3,<7",
  "pywin32>=311; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pyinstaller>=6.18,<7",
]

[project.scripts]
mdrk-builder = "mdrk_builder.ui.app:main"
mdrk-scan = "mdrk_builder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mdrk_builder.resources" = ["*.docx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
