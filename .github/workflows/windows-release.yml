name: Windows release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Verify release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag must be SemVer: vX.Y.Z"
          }

          $projectVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ("v$projectVersion" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match pyproject version $projectVersion"
          }

      - name: Install pinned release dependencies
        shell: pwsh
        run: |
          python -m pip install `
            -e ".[dev]" `
            "PyInstaller==6.22.0" `
            "pywin32==312" `
            "lxml==6.1.1" `
            "pytest==9.1.1"

      - name: Compile and test
        shell: pwsh
        run: |
          python -VV
          python -m PyInstaller --version
          python -m compileall -q src tests
          python -m pytest
          python -c "import tkinter; import pythoncom; import pywintypes; import win32com.client; import mdrk_builder.ui.app"

      - name: Build EXE
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean mdrk_builder.spec

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $env:MDRK_BUILDER_SMOKE_REPORT = "$PWD\dist\smoke-report.txt"
          $process = Start-Process `
            -FilePath "$PWD\dist\MDRK_Builder.exe" `
            -ArgumentList "--smoke-test" `
            -PassThru

          if (-not $process.WaitForExit(60000)) {
            taskkill /PID $process.Id /T /F
            if (Test-Path $env:MDRK_BUILDER_SMOKE_REPORT) {
              Get-Content $env:MDRK_BUILDER_SMOKE_REPORT
            }
            throw "Packaged smoke test timed out after 60 seconds"
          }

          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            if (Test-Path $env:MDRK_BUILDER_SMOKE_REPORT) {
              Get-Content $env:MDRK_BUILDER_SMOKE_REPORT
            }
            throw "Packaged smoke test failed: exit code $($process.ExitCode)"
          }

          if (Get-Process MDRK_Builder -ErrorAction SilentlyContinue) {
            throw "Packaged smoke test leaked an MDRK_Builder process"
          }

      - name: Prepare release assets
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = "dist\MDRK_Builder-$tag.exe"
          $zip = "dist\MDRK_Builder-$tag-windows-x64.zip"
          $buildInfo = "dist\BUILD_INFO.txt"

          Copy-Item "dist\MDRK_Builder.exe" $exe

          @(
            "tag=$tag"
            "commit=$env:GITHUB_SHA"
            "runner=$env:RUNNER_OS/$env:RUNNER_ARCH"
            "python=$(python -VV 2>&1)"
            "pyinstaller=$(python -m PyInstaller --version)"
            ""
            "Installed packages:"
            (python -m pip freeze)
          ) | Set-Content -Encoding utf8 $buildInfo

          Compress-Archive -Path $exe, "README.md", $buildInfo -DestinationPath $zip -Force

          Get-FileHash -Algorithm SHA256 -Path $exe, $zip |
            ForEach-Object {
              "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf)
            } |
            Set-Content -Encoding ascii "dist\SHA256SUMS.txt"

          @"
          MDRK Builder $tag — Windows x64 release candidate.

          В релизе:
          - готовый EXE;
          - ZIP с EXE, инструкцией и сведениями о сборке;
          - SHA-256 контрольные суммы.

          GitHub-сборка проверила тесты, упаковку, встроенный шаблон,
          генерацию DOCX и загрузку UI-модуля. Конвертацию DOC/RTF через
          Microsoft Word COM необходимо отдельно проверить на рабочем
          Windows-компьютере с установленным Word до использования на реальных
          документах.

          EXE не подписан цифровым сертификатом; SmartScreen может показать
          предупреждение Unknown publisher.
          "@ | Set-Content -Encoding utf8 "dist\RELEASE_NOTES.md"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MDRK_Builder-${{ github.ref_name }}-windows-x64
          path: |
            dist/MDRK_Builder-${{ github.ref_name }}.exe
            dist/MDRK_Builder-${{ github.ref_name }}-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = "dist\MDRK_Builder-$tag.exe"
          $zip = "dist\MDRK_Builder-$tag-windows-x64.zip"

          gh release create $tag `
            $exe `
            $zip `
            "dist\SHA256SUMS.txt" `
            "dist\BUILD_INFO.txt" `
            --verify-tag `
            --title "MDRK Builder $tag" `
            --notes-file "dist\RELEASE_NOTES.md"
