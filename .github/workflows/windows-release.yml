name: Windows internal pilot artifact

on:
  workflow_dispatch:

concurrency:
  group: internal-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-internal-package:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Verify internal version
        shell: pwsh
        run: |
          $projectVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $packageVersion = python -c "import sys; sys.path.insert(0, 'src'); import mdrk_builder; print(mdrk_builder.__version__)"

          if ($projectVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be SemVer X.Y.Z: $projectVersion"
          }
          if ($projectVersion -ne $packageVersion) {
            throw "Version mismatch: pyproject.toml=$projectVersion, package=$packageVersion"
          }

      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          python -m pip install `
            -e ".[dev]" `
            "PyInstaller==6.22.0" `
            "pywin32==312" `
            "lxml==6.1.1" `
            "pytest==9.1.1"

      - name: Compile and test
        shell: pwsh
        run: |
          python -VV
          python -m PyInstaller --version
          python -m compileall -q src tests tools/package_internal_release.py tools/privacy_gate.py
          python -m pytest
          python -c "import tkinter; import pythoncom; import pywintypes; import win32com.client; import mdrk_builder.ui.app"

      - name: Privacy gate
        shell: pwsh
        run: python tools/privacy_gate.py

      - name: Build EXE
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean mdrk_builder.spec

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $env:MDRK_BUILDER_SMOKE_REPORT = "$PWD\dist\smoke-report.txt"
          $process = Start-Process `
            -FilePath "$PWD\dist\MDRK_Builder.exe" `
            -ArgumentList "--smoke-test-ui" `
            -PassThru

          if (-not $process.WaitForExit(60000)) {
            taskkill /PID $process.Id /T /F
            if (Test-Path $env:MDRK_BUILDER_SMOKE_REPORT) {
              Get-Content $env:MDRK_BUILDER_SMOKE_REPORT
            }
            throw "Packaged smoke test timed out after 60 seconds"
          }

          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            if (Test-Path $env:MDRK_BUILDER_SMOKE_REPORT) {
              Get-Content $env:MDRK_BUILDER_SMOKE_REPORT
            }
            throw "Packaged smoke test failed: exit code $($process.ExitCode)"
          }

          if (Get-Process MDRK_Builder -ErrorAction SilentlyContinue) {
            throw "Packaged smoke test leaked an MDRK_Builder process"
          }

      - name: Prepare internal distribution folder
        id: package
        shell: pwsh
        run: |
          python tools/package_internal_release.py --replace
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT
          "package_dir=dist/MDRK_Builder_${version}_Internal" >> $env:GITHUB_OUTPUT

      - name: Audit packaged files
        shell: pwsh
        run: python tools/privacy_gate.py --release-candidate "${{ steps.package.outputs.package_dir }}"

      - name: Upload internal workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MDRK_Builder-${{ steps.package.outputs.version }}-Internal-windows-x64
          path: ${{ steps.package.outputs.package_dir }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
